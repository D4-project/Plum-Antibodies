[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plum-antibodies"
version = "0.1.0"
description = "Plum-Island tagging rules and tag validation library"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["plum_antibodies*"]
